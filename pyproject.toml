[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-drift-guardian"
version = "0.1.0"
description = "Scaffold for a tabular data quality and drift monitoring project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.3,<5",
    "plotly>=5.20,<7",
    "streamlit>=1.35,<2",
    "PyYAML>=6,<7",
    "pyarrow>=16,<24",
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "jupyter>=1,<2",
    "nbformat>=5.10,<6",
    "httpx2>=2.13,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "online_smoke: быстрый сквозной smoke persistent online-контура",
]
filterwarnings = [
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\.testclient',
]
