name: CI

on:
  push:
    branches: [main, pavel, mikhail]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.13 tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Check environment imports
        run: python scripts/check_environment.py

      - name: Run online persistence smoke
        run: python -m pytest -q -m online_smoke tests/acceptance

      - name: Run complete test suite
        run: python -m pytest -q

  docker:
    name: Docker build and healthcheck
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build --tag data-drift-guardian:ci .

      - name: Verify non-root runtime user
        run: |
          docker run --rm --entrypoint python data-drift-guardian:ci \
            -c "import os; print(f'uid={os.getuid()}'); raise SystemExit(os.getuid() == 0)"

      - name: Run container and verify health
        shell: bash
        run: |
          docker run --detach --name data-drift-guardian-ci \
            --publish 8501:8501 data-drift-guardian:ci
          trap 'docker logs data-drift-guardian-ci || true; docker rm --force data-drift-guardian-ci || true' EXIT

          for attempt in {1..45}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' data-drift-guardian-ci)"
            echo "health attempt ${attempt}: ${status}"
            if [ "${status}" = "healthy" ]; then
              curl --fail --silent --show-error \
                http://127.0.0.1:8501/_stcore/health
              exit 0
            fi
            if [ "${status}" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done

          echo "Container did not become healthy in time" >&2
          exit 1
